name = "stellwerk"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
RUNNER_LABELS = "self-hosted,stellwerk"
FLY_APP = "stellwerk-runners"
EXECUTOR = "fly"

[secrets]
required = [
  "GITHUB_APP_ID",
  "GITHUB_APP_PRIVATE_KEY",
  "GITHUB_WEBHOOK_SECRET",
  "FLY_API_TOKEN",
]
